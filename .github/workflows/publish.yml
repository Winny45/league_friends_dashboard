# Fetches from Riot, rebuilds the page and publishes it, once an hour, with
# nothing running on anybody's PC.
#
# Two kinds of state have to survive between runs, and they are kept in
# different places on purpose:
#
#   rank_history.json is irreplaceable. Riot does not expose past ranks, so
#   the whole Rank progress tab is built from snapshots this job has taken.
#   It goes in a private repo, with real history, and it is tiny.
#
#   matches_cache.json, scrape_log.json and champions_cache.json are only
#   there to avoid re-fetching. They are ~1.4MB that changes every hour, so
#   committing them hourly would add gigabytes a year to a repo whose history
#   nobody will ever read. They live in the Actions cache instead: if that is
#   ever evicted the next run is slow, and nothing is lost.
#
# The repo this runs in is public, so no fetched data is ever committed here.
# data.json, dashboard.html and og.png exist only inside the runner and go
# straight to Vercel.

name: Publish dashboard

on:
  schedule:
    # Every fifteen minutes, to publish once an hour.
    #
    # GitHub's scheduler is a queue, not a clock, and on a public repo it does
    # not merely run late: an hourly cron produced runs at 16:21, 19:39 and
    # 22:29 one evening, three of the eight it owed, leaving the page two
    # hours stale. Asking four times an hour and doing the work only when the
    # published page is actually old converts "most hours are skipped" into
    # "an hour is missed only if all four triggers are dropped".
    #
    # The gate job below is what stops this being four times the work: it
    # reads the live page and, on a scheduled run, stops here if that page is
    # less than fifty-five minutes old.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the published page is already fresh"
        type: boolean
        default: false

concurrency:
  # A slow run must never overlap the next one: two fetches sharing a cache
  # and a rank history would race to write both.
  group: publish-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Is the published page old enough to be worth rebuilding? Answered from the
  # live page itself rather than from stored state, so it cannot disagree with
  # what a visitor actually sees.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          page="$(curl -fsS --max-time 60 https://league-dashboard-static.vercel.app || true)"
          stamp="$(printf '%s' "$page" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}' | head -1)"
          if [ -z "$stamp" ]; then
            echo "Could not read a timestamp from the live page; rebuilding."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The page stamps local time (Europe/London), so compare in it.
          age=$(( $(date +%s) - $(TZ=Europe/London date -d "$stamp" +%s) ))
          echo "Live page says $stamp, which is $((age / 60)) minutes old."
          if [ "$age" -ge 3300 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Fresh enough; skipping this trigger."
          fi

  publish:
    needs: gate
    # The gate governs every trigger, not just the scheduled ones. It used to
    # exempt workflow_dispatch on the grounds that a person pressing a button
    # means it, which was true until nudge_publish.ps1 started pressing that
    # button on a timer: an hourly nudge then did the full fetch and deploy
    # every time regardless of whether the page needed it.
    #
    # Tick "force" to rebuild anyway, which is what a person wanting it now
    # actually wants.
    if: github.event.inputs.force == 'true' || needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # A warm run takes a couple of minutes. A cold one has to fetch the
    # detail of every match of the season, about 2,800 of them, and a
    # development key's rate limit puts that near an hour. The cache makes
    # this a first-run cost only, but the first run has to be allowed to
    # finish or it never gets a cache to reuse.
    timeout-minutes: 180

    steps:
      - name: Check out the generator
        uses: actions/checkout@v4

      # First, so an unconfigured repo says so plainly. Without this the run
      # dies in the checkout below with "Input required and not supplied:
      # token", which does not tell you that the answer is a repository
      # secret, let alone which one.
      - name: Check the secrets are set
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          STATE_REPO: ${{ secrets.STATE_REPO }}
          STATE_REPO_SSH_KEY: ${{ secrets.STATE_REPO_SSH_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in RIOT_API_KEY STATE_REPO STATE_REPO_SSH_KEY                       VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            eval "value=\$$name"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set up yet. Missing repository secrets:$missing"
            echo "ci/README.md has the steps. Every hourly run will fail here"
            echo "until these exist; disable this workflow meanwhile if the"
            echo "failure mail is a nuisance."
            exit 1
          fi
          echo "All six secrets are present."

      # An SSH deploy key rather than a personal access token. A PAT is
      # attached to the account and, unless it is a fine-grained one scoped by
      # hand, reaches every repo the account owns. This key can write to the
      # state repo and nothing else, and revoking it is deleting one key.
      - name: Check out the private state
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STATE_REPO }}
          ssh-key: ${{ secrets.STATE_REPO_SSH_KEY }}
          path: .state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fetch_data.py is pure standard library. generate_dashboard.py is too
      # for the page itself, but it draws the Open Graph link-preview card
      # with Pillow, behind a try/except: without it the page builds fine and
      # og.png simply is not written, which is how the first run got as far as
      # copying a file that did not exist.
      - name: Install Pillow, for the link preview card
        run: python -m pip install --quiet Pillow

      # A branch in the state repo rather than the Actions cache. The Actions
      # cache only writes in a post step, and a post step is skipped when a
      # job is cancelled: the first cold run hit the job timeout, so an hour
      # of fetching was thrown away and the next run would have started from
      # nothing again, forever. This branch is written by an ordinary step
      # that runs even when the job is cancelled.
      - name: Restore the fetch caches
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.STATE_REPO }}
          ref: cache
          ssh-key: ${{ secrets.STATE_REPO_SSH_KEY }}
          path: .cache

      - name: Bring the stored state into the working copy
        run: |
          cp .state/rank_history.json ./rank_history.json
          for f in matches_cache.json scrape_log.json champions_cache.json key_state.json; do
            if [ -f ".cache/$f" ]; then cp ".cache/$f" "./$f"; fi
          done
          ls -l *.json

      - name: Assemble config.json
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python ci/make_config.py

      - name: Fetch from Riot
        run: python fetch_data.py

      - name: Rebuild the page
        run: python generate_dashboard.py

      - name: Assemble the deploy directory
        run: |
          cp dashboard.html deploy/index.html
          # Tolerant on purpose: the share images are decoration, and a
          # missing link preview is not a reason to stop publishing a page
          # that is otherwise correct.
          for f in og.png icon-180.png; do
            if [ -f "$f" ]; then cp "$f" deploy/; else echo "note: $f was not built"; fi
          done
          ls -l deploy

      - name: Check the page before it goes public
        run: python ci/check_deploy.py

      - name: Publish to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          cd deploy
          # A token, and CI set, so the CLI can never decide it wants an
          # interactive login. A scheduled Windows run of the same deploy hit
          # exactly that and sat on a device-code prompt forever, with no
          # console to show it. Actions would time out rather than hang, but
          # an hour of a runner is still an hour.
          CI=1 vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

      # always(), so a run killed by the job timeout still keeps whatever it
      # managed to fetch. fetch_data.py writes the cache incrementally, so
      # partial progress is real progress and the next run carries on.
      - name: Save the fetch caches
        if: always()
        run: |
          for f in matches_cache.json scrape_log.json champions_cache.json key_state.json; do
            if [ -f "$f" ]; then cp "$f" ".cache/$f"; fi
          done
          cd .cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Caches unchanged."
          else
            # An orphan commit every time, force-pushed. There is no value in
            # the history of a rebuildable cache, and keeping one would add
            # gigabytes a year for nobody to read.
            git checkout -q --orphan snapshot
            git add -A
            git commit -q -m "Cache snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push -q --force origin snapshot:cache
            echo "Caches saved."
          fi

      # Last, so a failed fetch or a failed deploy leaves the stored history
      # exactly as it was.
      - name: Save the rank history
        run: |
          cp rank_history.json .state/rank_history.json
          cd .state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only this one file, by name. A bare `git add -A` here would be the
          # one line that could commit fetched player data by accident.
          git add rank_history.json
          if git diff --cached --quiet; then
            echo "No new rank snapshots."
          else
            git commit -m "Rank snapshots $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
